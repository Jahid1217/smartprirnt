# Production profile: docker compose sets SPRING_PROFILES_ACTIVE=prod.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.smartprint: INFO

management:
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
